
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SellEasy</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">
            SellEasy
        </div>

        <div class="nav-links">

            <button onclick="showHome()">
                Home
            </button>

            <button onclick="showSell()">
                Sell Product
            </button>

            <button onclick="showMessages()">
                Messages
            </button>

        </div>

    </nav>



    <!-- ================= HOME PAGE ================= -->

    <section id="homePage">

        <div class="hero">

            <h1>
                Buy & Sell Products Easily
            </h1>

            <p>
                Find what you need or sell what you don't need.
            </p>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >

            <button onclick="searchProducts()">
                Search
            </button>

        </div>


        <!-- CATEGORIES -->

        <div class="categories">

            <button onclick="filterProducts('All')">
                All
            </button>

            <button onclick="filterProducts('Electronics')">
                Electronics
            </button>

            <button onclick="filterProducts('Furniture')">
                Furniture
            </button>

            <button onclick="filterProducts('Books')">
                Books
            </button>

            <button onclick="filterProducts('Vehicles')">
                Vehicles
            </button>

            <button onclick="filterProducts('Others')">
                Others
            </button>

        </div>


        <!-- PRODUCTS -->

        <div class="products-section">

            <h2>
                Latest Products
            </h2>

            <div id="productList">

                <!-- Products will come here -->

            </div>

        </div>

    </section>



    <!-- ================= SELL PAGE ================= -->

    <section id="sellPage" class="hidden">

        <div class="form-box">

            <h2>
                Sell Your Product
            </h2>


            <label>
                Product Name
            </label>

            <input
                type="text"
                id="productName"
                placeholder="Enter product name"
            >


            <label>
                Category
            </label>

            <select id="productCategory">

                <option value="">
                    Select Category
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Furniture">
                    Furniture
                </option>

                <option value="Books">
                    Books
                </option>

                <option value="Vehicles">
                    Vehicles
                </option>

                <option value="Others">
                    Others
                </option>

            </select>


            <label>
                Price
            </label>

            <input
                type="number"
                id="productPrice"
                placeholder="Enter price"
            >


            <label>
                Location
            </label>

            <input
                type="text"
                id="productLocation"
                placeholder="Enter location"
            >


            <label>
                Description
            </label>

            <textarea
                id="productDescription"
                placeholder="Enter product description"
            ></textarea>


            <label>
                Product Image
            </label>

            <input
                type="file"
                id="productImage"
                accept="image/*"
            >


            <label>
                Seller Name
            </label>

            <input
                type="text"
                id="sellerName"
                placeholder="Enter your name"
            >


            <button
                class="main-btn"
                onclick="addProduct()">

                Post Product

            </button>

        </div>

    </section>



    <!-- ================= PRODUCT DETAILS ================= -->

    <section id="detailsPage" class="hidden">

        <div id="productDetails">

            <!-- Product details will come here -->

        </div>

    </section>



    <!-- ================= MESSAGE PAGE ================= -->

    <section id="messagePage" class="hidden">

        <div class="message-box">

            <h2>
                Messages
            </h2>

            <div id="messageList">

                <!-- Messages will come here -->

            </div>

        </div>

    </section>



    <section id="purchasePage" class="hidden">

        <div id="purchaseDetails">

            <!-- Purchase confirmation will come here -->

        </div>

    </section>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
